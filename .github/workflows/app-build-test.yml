name: app-build-test

on:
  push:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app-build-test.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app-build-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ubuntu-latest / Rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-build-test-ubuntu-latest-stable
      - name: Install Linux development libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check CPU-only desktop
        run: cargo clippy -p earthcraft --all-targets --no-default-features --locked -- -D warnings
      - name: Build desktop application
        run: cargo build --workspace --locked
