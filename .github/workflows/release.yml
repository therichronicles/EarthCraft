name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package_release.py'
      - 'scripts/test_package_release.py'
      - 'cliff.toml'
      - 'assets/macos/icon.icns'
      - 'assets/macos/dmg-background*.png'
      - 'docs/RELEASING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: version
        name: Require a tag matching Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_release.py validate --tag "$RELEASE_TAG"
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p 'test_package_release.py'
      - name: Generate complete changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          args: --output CHANGELOG.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-changelog-${{ steps.version.outputs.version }}
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: earthcraft
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: earthcraft.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: earthcraft.exe
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: earthcraft
          - os: macos-14
            target: aarch64-apple-darwin
            executable: earthcraft
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cpu-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test release packaging on the native platform
        run: python -m unittest discover -s scripts -p 'test_package_release.py'
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Build CPU-only release binary
        run: cargo build -p earthcraft --release --no-default-features --locked --target ${{ matrix.target }}
      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: python -m pip install dmgbuild==1.6.7
      - name: Package application
        run: python scripts/package_release.py package --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: earthcraft-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [version, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: earthcraft-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Verify archives and assemble release checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          rm -- *.sha256
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json > /dev/null; then
              echo "::error::This release is already published; use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "EarthCraft $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
