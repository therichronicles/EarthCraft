name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/release-tools/**'
      - 'scripts/package_*.py'
      - 'scripts/test_package_*.py'
      - 'packaging/**'
      - 'assets/packaging/**'
      - 'cliff.toml'
      - 'docs/RELEASING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: version
        name: Require a tag matching Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_release.py validate --tag "$RELEASE_TAG"
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p 'test_package_*.py'
      - name: Generate complete changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          args: --output CHANGELOG.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-changelog-${{ steps.version.outputs.version }}
          path: CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: earthcraft
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: earthcraft.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: earthcraft.exe
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: earthcraft
          - os: macos-14
            target: aarch64-apple-darwin
            executable: earthcraft
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cpu-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test release packaging on the native platform
        run: python -m unittest discover -s scripts -p 'test_package_*.py'
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Build CPU-only release binary
        run: cargo build -p earthcraft --release --no-default-features --locked --target ${{ matrix.target }}
      - uses: ./.github/actions/release-tools
        if: runner.os != 'Windows' || matrix.target == 'x86_64-pc-windows-msvc'
        with:
          rpm: ${{ runner.os == 'Linux' }}
      - name: Install macOS DMG layout tool
        if: runner.os == 'macOS'
        run: python -m pip install dmgbuild==1.6.7
      - name: Package application
        run: python scripts/package_release.py package --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y desktop-file-utils appstream zsync rpm libgirepository1.0-dev librsvg2-dev patchelf file
      - name: Package Linux installers and AppImage
        if: runner.os == 'Linux'
        run: python scripts/package_linux.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/earthcraft --output dist --formats deb rpm appimage
      - name: Inspect Linux package metadata
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          desktop-file-validate packaging/earthcraft.desktop
          appstreamcli validate --no-net packaging/earthcraft.metainfo.xml
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
      - name: Install WiX for ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package Windows MSI and standalone executable
        if: runner.os == 'Windows'
        run: python scripts/package_windows.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: earthcraft-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux-bundles:
    name: Linux ${{ matrix.arch }} / ${{ matrix.format }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      GSETTINGS_BACKEND: memory
      EARTHCRAFT_FLATPAK_CACHE: ${{ github.workspace }}/target/packaging/flatpak-cache
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [flatpak, snap]
        include:
          - arch: x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.format }}-${{ matrix.target }}
      - name: Cache Flatpak SDK installation
        if: matrix.format == 'flatpak'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-v1-${{ matrix.target }}-gnome49-rust25.08-${{ hashFiles('packaging/flatpak.json') }}
      - name: Cache Flatpak build state
        if: matrix.format == 'flatpak'
        uses: actions/cache@v6
        with:
          path: target/packaging/flatpak-cache
          key: flatpak-build-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'packaging/flatpak.json') }}-${{ github.sha }}
          restore-keys: |
            flatpak-build-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'packaging/flatpak.json') }}-
      - name: Install Flatpak builder and SDK
        if: matrix.format == 'flatpak'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak dbus-daemon
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --or-update flathub org.flatpak.Builder org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08
          dbus-run-session -- flatpak run --command=flatpak-spawn org.flatpak.Builder --host flatpak info --user org.gnome.Sdk//49
      - name: Package Flatpak
        if: matrix.format == 'flatpak'
        run: python scripts/package_linux.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --output dist --formats flatpak
      - name: Install Snapcraft
        if: matrix.format == 'snap'
        run: sudo snap install snapcraft --classic
      - name: Package Snap
        if: matrix.format == 'snap'
        run: python scripts/package_linux.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --output dist --formats snap
      - uses: actions/upload-artifact@v7
        with:
          name: earthcraft-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  freebsd:
    name: FreeBSD x86-64
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Cache FreeBSD Cargo dependencies
        uses: actions/cache@v6
        with:
          path: target/freebsd-cache
          key: freebsd14.5-rust1.95-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            freebsd14.5-rust1.95-${{ hashFiles('Cargo.lock') }}-
      - name: Build and package in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          cache-after-prepare: true
          cpu: 4
          mem: 12288
          prepare: |
            pkg install -y curl git pkgconf python312 gtk3 libudev-devd libinotify libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          run: |
            set -eu
            . "$HOME/.cargo/env"
            export CARGO_HOME="$(pwd)/target/freebsd-cache/cargo"
            export CARGO_TARGET_DIR="$(pwd)/target/freebsd-cache/target" CARGO_BUILD_JOBS=4
            touch apps/earthcraft/src/main.rs
            cargo build -p earthcraft --release --no-default-features --locked --target x86_64-unknown-freebsd
            python3.12 -m unittest discover -s scripts -p 'test_package_*.py'
            python3.12 scripts/package_release.py package --version "$(python3.12 scripts/package_release.py validate)" --target x86_64-unknown-freebsd --binary "$CARGO_TARGET_DIR/x86_64-unknown-freebsd/release/earthcraft" --output dist
            ldd "$CARGO_TARGET_DIR/x86_64-unknown-freebsd/release/earthcraft"
      - uses: actions/upload-artifact@v7
        with:
          name: earthcraft-${{ needs.version.outputs.version }}-x86_64-unknown-freebsd
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [version, build, linux-bundles, freebsd]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: earthcraft-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Require the complete native release asset set
        run: python scripts/package_release.py verify --version ${{ needs.version.outputs.version }} --output dist
      - name: Verify archives and assemble release checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          rm -- *.sha256
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json > /dev/null; then
              echo "::error::This release is already published; use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "EarthCraft $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
