<?xml version="1.0" encoding="UTF-8"?>
<!-- EarthCraft live-flight marker. The egui renderer reads these SVG polygons directly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-label="Airplane top view">
  <g fill="#f3faff">
    <!-- Swept-back main wings -->
    <polygon points="10.8,8.4 1.6,14.3 1.6,16.1 10.8,12.9"/>
    <polygon points="13.2,8.4 22.4,14.3 22.4,16.1 13.2,12.9"/>
    <!-- Horizontal stabilizers -->
    <polygon points="10.9,18.3 5.9,21.6 5.9,22.7 11.2,20.8"/>
    <polygon points="13.1,18.3 18.1,21.6 18.1,22.7 12.8,20.8"/>
    <!-- Nose, cockpit and fuselage -->
    <polygon points="12,1 13.1,2.2 14.1,18.4 13.1,22.4 12,23.5 10.9,22.4 9.9,18.4 10.9,2.2"/>
  </g>
</svg>
