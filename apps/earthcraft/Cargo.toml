[package]
name = "earthcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "3D globe in the style of Google Earth in Rust / globo 3D estilo Google Earth em Rust (Windows, macOS, Linux)"
license.workspace = true
authors = ["EarthCraft"]

[lints]
workspace = true

[features]
default = ["gpu"]
gpu = ["earthcraft-render/gpu"]
profiling = ["earthcraft-data/profiling", "earthcraft-render/profiling"]

[dependencies]
earthcraft-core.workspace = true
earthcraft-data.workspace = true
earthcraft-render.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
emath.workspace = true
image.workspace = true
rstar.workspace = true
sys-locale.workspace = true
self_update.workspace = true

# Native file/folder dialogs. Linux and FreeBSD use GTK3 without a desktop portal.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
rfd = { workspace = true, features = ["gtk3"] }
[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
rfd = { workspace = true, default-features = true }

[package.metadata.generate-rpm]
name = "earthcraft"
summary = "3D globe explorer with satellite imagery, live layers and KML places"
url = "https://github.com/therichronicles/EarthCraft"
assets = [
    { source = "target/release/earthcraft", dest = "/usr/bin/earthcraft", mode = "755" },
    { source = "packaging/earthcraft.desktop", dest = "/usr/share/applications/earthcraft.desktop", mode = "644" },
    { source = "assets/packaging/icon_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/earthcraft.png", mode = "644" },
    { source = "packaging/earthcraft.metainfo.xml", dest = "/usr/share/metainfo/com.theri.earthcraft.metainfo.xml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/earthcraft/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"
libgcc = "*"
gtk3 = "*"
libX11 = "*"
libxkbcommon = "*"
wayland-libs = "*"
xdg-utils = "*"

[package.metadata.generate-rpm.recommends]
espeak-ng = "*"

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
