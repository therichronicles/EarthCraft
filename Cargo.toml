[workspace]
members = [
    "apps/earthcraft",
    "crates/earthcraft-core",
    "crates/earthcraft-data",
    "crates/earthcraft-render",
]
default-members = ["apps/earthcraft"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
earthcraft-core = { path = "crates/earthcraft-core" }
earthcraft-data = { path = "crates/earthcraft-data" }
earthcraft-render = { path = "crates/earthcraft-render", default-features = false }
eframe = "0.36.2"
# Native desktop menu adapters; keep GUI/platform dependencies out of the libraries.
muda = { version = "0.21.2", default-features = false }
rfd = { version = "0.17.2", default-features = false }
winresource = "0.1.34"
emath = "0.36.2"
egui-wgpu = "0.36.2"
sys-locale = "0.3.2"
geographiclib-rs = { version = "0.2.7", default-features = false }
glam = { version = "0.34.1", default-features = false, features = ["std", "f64"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = "30.0.1"
pollster = "1.0.1"
wide = "1.7.1"
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
thiserror = "2.0.21"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
unicode-normalization = "0.1.25"
quick-xml = "0.42.0"
kml = { version = "0.14.0", default-features = false, features = ["zip"] }
# Match GeoRust KML's ZIP dependency; the direct dependency writes KMZ exports.
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
rayon = "1.12.0"
rstar = "0.13.0"
geo-index = "0.4.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-rusqlite = "0.8.0"
fst = "0.4.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
